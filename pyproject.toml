[project]
name = "video-subtitler"
version = "0.1.0"
description = "Gemini-powered CLI for generating VTT subtitles from video."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=3.3.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.2",
    "webvtt-py>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["BLE001", "SIM115"]
