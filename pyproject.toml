[project]
name = "lyrics-generator"
version = "0.1.0"
description = "Gemini-powered CLI for generating timed lyrics from song audio."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
